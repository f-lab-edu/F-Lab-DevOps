name: AI 운영 조사 로컬 검사

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches:
      - main
      - codex/ai-incident-copilot
    paths:
      - 'ai-ops/**'
      - 'cluster-addons/ai-ops/**'
      - '.github/workflows/ai-ops-ci.yml'
      - '.github/workflows/ai-ops-image.yml'
      - '.github/workflows/ai-ops-lab-ci.yml'
      - '.github/workflows/ai-ops-normal-ci.yml'
      - '.github/workflows/ai-ops-c2-rollback.yml'
      - '.github/workflows/ai-ops-c4-ready-rollback.yml'
      - '.github/workflows/ci-cd.yml'
      - '.github/scripts/**'
      - 'url-shortener/app/**'
      - 'url-shortener/url-shortener-chart/**'

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      ai_changes: ${{ steps.scope.outputs.ai_changes }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            echo "ai_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$changed_files"
          ai_changes=false
          while IFS= read -r -d '' path; do
            case "$path" in
              ai-ops/*|cluster-addons/ai-ops/*|.github/scripts/*|url-shortener/app/*|url-shortener/url-shortener-chart/*|.github/workflows/ai-ops-ci.yml|.github/workflows/ai-ops-image.yml|.github/workflows/ai-ops-lab-ci.yml|.github/workflows/ai-ops-normal-ci.yml|.github/workflows/ai-ops-c2-rollback.yml|.github/workflows/ai-ops-c4-ready-rollback.yml|.github/workflows/ci-cd.yml)
                ai_changes=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "ai_changes=$ai_changes" >> "$GITHUB_OUTPUT"

  contracts:
    needs: scope
    if: needs.scope.outputs.ai_changes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 버전 7.0.1
      - name: 잠금된 데이터 계약 의존성 설치
        run: |
          python3 -m venv /tmp/ai-ops-venv
          /tmp/ai-ops-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r ai-ops/requirements.lock
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # 버전 5.0.1
        with:
          version: v4.1.3
      - name: 계약·증거 처리·로컬 조사·fixture 검사
        run: |
          /tmp/ai-ops-venv/bin/python -m compileall -q ai-ops/src ai-ops/scripts ai-ops/tests
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python -m ai_ops --help
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python -m unittest discover -s ai-ops/tests -p 'test_*.py' -v
          /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_dev_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_holdout_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_holdout_v2_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_holdout_v3_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/export_schemas.py
          git diff --exit-code -- ai-ops/schemas
      - name: 배포 정의·읽기 권한·통신·저장 정적 검사
        run: PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/check_deployment.py

  image:
    needs: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 버전 7.0.1
      - name: 독립 에이전트 이미지 빌드
        run: docker build --tag ai-ops:ci ai-ops
      - name: 통신 없는 읽기 전용 이미지 실행 검사
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m ai-ops:ci --help
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python ai-ops:ci -c \
            'import os, pydantic; from ai_ops.replay_tools import _runbook; assert os.getuid() == 10001; assert pydantic.__version__ == "2.13.5"; [_runbook(name) for name in ("cache", "database", "deployment")]'


  main-gate:
    name: C03 Main PR Gate
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: [scope, contracts, image]
    runs-on: ubuntu-24.04
    steps:
      - name: 적용 범위에 맞는 검사 결과 확인
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          AI_CHANGES: ${{ needs.scope.outputs.ai_changes }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          case "$AI_CHANGES" in
            true)
              [[ "$CONTRACTS_RESULT" == success && "$IMAGE_RESULT" == success ]]
              ;;
            false)
              [[ "$CONTRACTS_RESULT" == skipped && "$IMAGE_RESULT" == skipped ]]
              ;;
            *) exit 1 ;;
          esac
