name: AI 운영 조사 데이터 계약 검사

on:
  pull_request:
    paths:
      - 'ai-ops/**'
      - '.github/workflows/ai-ops-ci.yml'
  push:
    branches:
      - main
      - codex/ai-incident-copilot
    paths:
      - 'ai-ops/**'
      - '.github/workflows/ai-ops-ci.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 버전 6
      - name: 잠금된 데이터 계약 의존성 설치
        run: |
          python3 -m venv /tmp/ai-ops-venv
          /tmp/ai-ops-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r ai-ops/requirements.lock
      - name: 계약·증거 처리·fixture·생성 스키마 검사
        run: |
          /tmp/ai-ops-venv/bin/python -m compileall -q ai-ops/src ai-ops/scripts ai-ops/tests
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python -m unittest discover -s ai-ops/tests -p 'test_*.py' -v
          /tmp/ai-ops-venv/bin/python ai-ops/scripts/build_dev_fixtures.py --check
          PYTHONPATH=ai-ops/src /tmp/ai-ops-venv/bin/python ai-ops/scripts/export_schemas.py
          git diff --exit-code -- ai-ops/schemas
