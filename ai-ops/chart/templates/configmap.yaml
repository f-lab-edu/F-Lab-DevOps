{{- include "ai-ops.validate" . -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-ops.labels" . | nindent 4 }}
data:
  bindings.json: |
    {{- .Values.config.bindings | toPrettyJson | nindent 4 }}
  runtime.json: |
    {{- .Values.config.runtime | toPrettyJson | nindent 4 }}
  metric-queries.json: |
    {{- .Files.Get "files/metric-queries.json" | nindent 4 }}
{{- end }}
