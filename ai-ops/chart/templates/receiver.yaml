{{- if and .Values.enabled .Values.receiver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webhook
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-ops.selector" . | nindent 4 }}
  ports:
    - {name: webhook-tls, port: 9443, targetPort: webhook-tls, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-webhook-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-ops.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.receiver.alertmanagerNamespace | quote }}
          podSelector:
            matchLabels:
              {{- .Values.receiver.alertmanagerPodLabels | toYaml | nindent 14 }}
      ports:
        - {protocol: TCP, port: 9443}
{{- end }}
