{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    {{- include "ai-ops.selector" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-ops.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "ai-ops.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-ops.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s%s" (toJson .Values.config.bindings) (toJson .Values.config.runtime) (.Files.Get "files/metric-queries.json") | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-investigator
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ if eq .Values.mode "worker" }}90{{ else }}15{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diagnostics
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, {{ if eq .Values.mode "worker" }}ai_ops.worker_runtime{{ else }}ai_ops.deployment_check{{ end }}]
          {{- if or (eq .Values.mode "diagnostics") .Values.observability.enabled .Values.retention.enabled }}
          args:
            {{- if eq .Values.mode "diagnostics" }}
            - --serve
            {{- end }}
            {{- if .Values.observability.enabled }}
            - --metrics
            {{- end }}
            {{- if .Values.retention.enabled }}
            - --retention
            {{- end }}
          {{- end }}
            {{- if .Values.observability.enabled }}
          ports:
            - {name: metrics, containerPort: 9091, protocol: TCP}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: HOME, value: /tmp}
            - {name: AI_OPS_RUNBOOK_ROOT, value: /opt/ai-ops/runbooks}
          resources:
            {{- .Values.resources | toYaml | nindent 12 }}
          startupProbe:
            exec:
              command: {{ if eq .Values.mode "worker" }}[python, -m, ai_ops.worker_runtime, --probe]{{ else }}[python, -m, ai_ops.deployment_check]{{ end }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: {{ if eq .Values.mode "worker" }}[python, -m, ai_ops.worker_runtime, --probe]{{ else }}[python, -m, ai_ops.deployment_check]{{ end }}
            periodSeconds: 30
            timeoutSeconds: 5
          {{- if eq .Values.mode "worker" }}
          livenessProbe:
            exec:
              command: [python, -m, ai_ops.worker_runtime, --probe]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /etc/ai-ops, readOnly: true}
            - {name: kubernetes-identity, mountPath: /var/run/ai-ops/kubernetes, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        {{- if .Values.receiver.enabled }}
        - name: alert-receiver
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, ai_ops.alert_receiver]
          args: [--cluster-id, {{ (first .Values.config.bindings.bindings).target.cluster_id | quote }}]
          ports:
            - {name: webhook-tls, containerPort: 9443, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          startupProbe:
            tcpSocket: {port: webhook-tls}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket: {port: webhook-tls}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: webhook-tls}
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /etc/ai-ops, readOnly: true}
            - {name: webhook-identity, mountPath: /etc/ai-ops-webhook, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        {{- if .Values.receiver.enabled }}
        - name: webhook-identity
          secret:
            secretName: {{ .Values.receiver.identitySecretName | quote }}
            defaultMode: 0440
            items:
              - {key: token, path: token}
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        {{- end }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: kubernetes-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.identity.tokenExpirationSeconds }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
