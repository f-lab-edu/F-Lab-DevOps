# 실제 환경값을 확인하기 전에는 어떤 리소스도 생성하지 않는다.
enabled: false
image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent
# 첫 묶음은 수신기·큐·모델 대신 로컬 검사만 하는 진단 모드다.
mode: diagnostics
replicaCount: 1
config:
  bindings: {}
  runtime: {}
persistence:
  storageClassName: ""
  size: 5Gi
network:
  # API 주소 변환 전후의 실제 도착 IP를 확인한 뒤 /32 단위로 지정한다.
  apiServerCIDRs: []
  dns:
    namespace: kube-system
    podLabels: {}
  prometheus:
    namespace: monitoring
    podLabels: {}
    port: 9090
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# 기본 토큰 수명은 1시간이며 진단 배포에서는 10분으로 교체를 확인한다.
identity:
  tokenExpirationSeconds: 3600

# 메트릭 포트는 진단 실행과 명시적인 Prometheus 수집을 함께 켠 경우에만 연다.
observability:
  enabled: false
retention:
  # worker 안전 지점에서만 실행하며 명시적으로 활성화해야 한다.
  enabled: false
receiver:
  # TLS 인증서·공유 인증값은 사전 준비한 Secret에서만 마운트한다.
  enabled: false
  identitySecretName: ""
  alertmanagerNamespace: monitoring
  alertmanagerPodLabels: {}
