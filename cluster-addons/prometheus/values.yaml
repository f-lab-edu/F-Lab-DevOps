# ── Prometheus 설정 ───────────────────────────────────────────
prometheus:
  prometheusSpec:
    # 모든 namespace의 ServiceMonitor를 감시
    # 기본값은 kube-prometheus-stack과 동일 namespace만 감시
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # 모든 namespace의 PrometheusRule을 감지
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # 메트릭 보관 기간 및 용량 상한
    retention: 7d
    retentionSize: "40GiB"  # 50Gi PVC 기준 디스크 풀 방지를 위한 여유 공간 확보

    # EBS PVC 기반 영구 저장소
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

    # Prometheus Pod 리소스 제한 (노드 OOM 방지)
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi

# ── Grafana 설정 ──────────────────────────────────────────────
grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password              # Secret의 key 이름
  service:
    type: ClusterIP
  persistence:
    enabled: true          # Grafana 대시보드/설정 재시작 후에도 유지
    storageClassName: gp2
    size: 5Gi
  # (실습에서는 persistence.enabled: false 로 비용 절감 가능)

# ── AlertManager 설정 ─────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    secrets:
      - alertmanager-slack-secret   # Webhook URL이 담긴 Secret을 Pod에 마운트
      - alertmanager-heartbeat-secret   # Heartbeat Secret을 Pod에 마운트
      - ai-ops-alertmanager-auth   # 내부 AI 수신기의 인증값·CA 파일

  # WF11(2026-11-25): wf03/prepare.py로 legacy-values.yaml에서 생성한 전환 설정이다.
  # 직접 고치지 말고 prepare.py --event-service ai-ops-events.ai-ops.svc --source-alias eks-seoul로 다시 만든다.
  # 시험(test_live_values_*)이 이 블록과 생성 결과의 일치를 강제한다.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
      - '...'
      group_wait: 0s
      repeat_interval: 1h
      receiver: slack-notifications
      routes:
      - matchers:
        - alertname="Watchdog"
        receiver: heartbeat-receiver
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 5m
      - receiver: slack-notifications
        continue: true
      - receiver: ai-events
    receivers:
    - name: 'null'
    - name: heartbeat-receiver
      webhook_configs:
      - url_file: /etc/alertmanager/secrets/alertmanager-heartbeat-secret/webhook-url
        send_resolved: false
        timeout: 10s
    - name: slack-notifications
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-secret/webhook-url
        title: 경보 발생·해제 사실
        text: |-
          {{ define "wf03.notice" }}{{ range $index, $alert := .Alerts }}{{ if lt $index 3 }}
          경보 {{ if eq .Status "resolved" }}해제{{ else }}발생{{ end }} 사실 (원인·복구 성공 판정 아님)
          경보명: {{ if match "^[A-Za-z0-9_.:-]{1,64}$" .Labels.alertname }}{{ .Labels.alertname }}{{ else }}미확인{{ end }}
          심각도: {{ if match "^(critical|warning|info)$" .Labels.severity }}{{ .Labels.severity }}{{ else }}미확인{{ end }}
          대상: {{ range $key := stringSlice "cluster_id" "namespace" "workload" "service" "environment" }}{{ $key }}={{ $value := index $alert.Labels $key }}{{ if match "^[A-Za-z0-9_.:-]{1,64}$" $value }}{{ $value }}{{ else }}미확인{{ end }} {{ end }}
          발생 시각: {{ .StartsAt.UTC.Format "2006-01-02T15:04:05.000000000Z" }}
          {{ if eq .Status "resolved" }}해제 시각: {{ .EndsAt.UTC.Format "2006-01-02T15:04:05.000000000Z" }}
          {{ end }}{{ if match "^[0-9a-f]{16}$" .Fingerprint }}사건 참조: al1/eks-seoul/{{ .Fingerprint }}/{{ .StartsAt.UTC.Format "2006-01-02T15:04:05.000000000Z" }}
          {{ else }}사건 참조: 생성 불가 — 발신 경보 식별값 확인 필요
          {{ end }}조사 채널: #ai-ops
          사건 참조는 식별용이며, 조사 접수 여부와 지원 대상은 해당 채널에서 별도 확인합니다. 공지는 자동 복구 승인이 아닙니다.
          {{ end }}{{ end }}{{ if gt (len .Alerts) 3 }}표시 상한: 경보 3개만 표시했습니다. 나머지는 Alertmanager에서 확인하세요.{{ end }}{{ end }}
          {{ template "wf03.notice" . }}
        send_resolved: true
        fallback: '경보 발생·해제 사실: 채널의 사건 참조와 상세 내용을 확인하세요.'
        title_link: ''
        mrkdwn_in: []
        link_names: false
    - name: ai-events
      webhook_configs:
      - url: https://ai-ops-events.ai-ops.svc:9443/v1/events
        send_resolved: true
        timeout: 5s
        max_alerts: 32
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/ai-ops-alertmanager-auth/token
          follow_redirects: false
          tls_config:
            ca_file: /etc/alertmanager/secrets/ai-ops-alertmanager-auth/ca.crt
            server_name: ai-ops-events.ai-ops.svc
    inhibit_rules:
    - source_matchers:
      - severity="critical"
      target_matchers:
      - severity="warning"
      equal:
      - alertname
      - namespace
      - pod
      - service
