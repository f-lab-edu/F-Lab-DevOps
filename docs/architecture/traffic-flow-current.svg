<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1670" viewBox="0 0 2200 1670" role="img">
<title>현재 API 요청 및 제어 흐름 아키텍처 (운영 코드 선언 기준)</title><desc>사용자 요청은 Route 53과 인터넷 공개 NLB의 IP target을 거쳐 Traefik Pod에 직접 전달되고, Traefik은 Ingress 규칙에 따라 API Service 및 Pod로 보낸다. 제어 흐름과 HTTP 308 경로를 구분한다.</desc>
