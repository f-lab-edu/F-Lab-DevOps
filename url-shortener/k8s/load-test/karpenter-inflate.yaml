apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-inflate
  namespace: url-shortener
  labels:
    app: karpenter-inflate
    purpose: week12-load-test
spec:
  replicas: 0
  selector:
    matchLabels:
      app: karpenter-inflate
  template:
    metadata:
      labels:
        app: karpenter-inflate
        purpose: week12-load-test
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 900m
              memory: 512Mi
            limits:
              cpu: 900m
              memory: 512Mi
