{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: {{ .Release.Name }}-api
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.api.smokeTest.enabled }}
    # Argo CD PostSync Job이 클러스터 내부에서 사용자 경로를 검증한다.
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-smoke-test
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- end }}
    # Traefik 컨트롤러만 사용자 요청을 API Pod에 전달할 수 있다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefik.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.traefik.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    # Prometheus만 API 메트릭 경로에 접근할 수 있다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheus.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheus.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    # RDS·Redis 호스트 이름을 해석하기 위한 CoreDNS 통신이다.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Redis Service selector와 같은 라벨로 내부 Redis만 허용한다.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.redis.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.redis.port }}
    # 클러스터 밖 RDS에는 환경별 CIDR과 PostgreSQL 포트만 허용한다.
    {{- range .Values.networkPolicy.externalEgress.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.externalEgress.postgresPort }}
    {{- end }}
{{- end }}
