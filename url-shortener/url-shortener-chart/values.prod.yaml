api:
  replicas: 2 # prod는 고가용성을 위해 2개
  image:
    repository: 716174522908.dkr.ecr.ap-northeast-2.amazonaws.com/urlshortener
    tag: sha-572b134
    pullPolicy: IfNotPresent
  env:
    appEnv: production
    debug: 'false' # prod는 디버그 비활성화
    enableFaultInjection: false # Week 12 DB 지연 실습 때만 GitOps로 true 전환
    maxFaultDelayMs: 2000
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
pdb:
  enabled: true
  minAvailable: 1
postgres:
  enabled: false # 운영 환경
  database: urldb
  # 민감정보는 values.prod-secret.yaml로 분리해서 사용하세요 (Git ignore 권장)
  password: ""
  databaseUrl: ""
  storage: 10Gi # prod는 스토리지 넉넉하게
  storageClass: gp2
# Ingress 설정 (Traefik으로 이전 완료되어 차트 기본 Ingress 비활성화)
ingress:
  enabled: false
redis:
  enabled: true # prod: Redis 캐시 활성화
# --- ServiceMonitor 설정 ────────────────────────────────────────
serviceMonitor:
  enabled: true
