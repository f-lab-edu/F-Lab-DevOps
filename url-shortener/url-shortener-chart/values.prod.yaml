api:
  replicas: 2 # prod는 고가용성을 위해 2개
  image:
    repository: 716174522908.dkr.ecr.ap-northeast-2.amazonaws.com/urlshortener
    tag: sha-c3071c9
    pullPolicy: IfNotPresent
  env:
    appEnv: production
    debug: 'false' # prod는 디버그 비활성화
    enableFaultInjection: false # Week 12 DB 지연 실습 때만 GitOps로 true 전환
    maxFaultDelayMs: 2000
  # HPA 최대 10개와 롤링 업데이트 surge를 고려한 DB 연결 예산.
  # db.t3.micro 기준 Primary 최대 39개, Replica 최대 52개 연결을 사용한다.
  databasePool:
    write:
      size: 2
      maxOverflow: 1
    read:
      size: 3
      maxOverflow: 1
    timeoutSeconds: 10
  cacheConsistency:
    # 생성·삭제 직후 Replica의 오래된 결과를 현재 세대 캐시에 저장하지 않도록 한다.
    # 실제 RDS ReplicaLag의 p99/p999 관측값으로 조정한다.
    replicaWindowSeconds: 60
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
pdb:
  enabled: true
  minAvailable: 1
postgres:
  enabled: false # 운영 환경
  database: urldb
  # 민감정보는 values.prod-secret.yaml로 분리해서 사용하세요 (Git ignore 권장)
  password: ""
  databaseUrl: ""
  storage: 10Gi # prod는 스토리지 넉넉하게
  storageClass: gp2
# Ingress 설정 (Traefik으로 이전 완료되어 차트 기본 Ingress 비활성화)
ingress:
  enabled: false
redis:
  enabled: true # prod: Redis 캐시 활성화
# --- ServiceMonitor 설정 ────────────────────────────────────────
serviceMonitor:
  enabled: true
