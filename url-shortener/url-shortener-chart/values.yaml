# ── API 설정 ──────────────────────────────────────────────
api:
  replicas: 2
  secretRevision: 1 # 외부 Secret 변경 후 증가시켜 새 Pod에 환경변수를 주입
  smokeTest:
    enabled: false
  port: 8000
  image:
    repository: url-shortener-api
    tag: v1
    pullPolicy: Never
  env:
    appEnv: production
    debug: 'false'
    enableFaultInjection: false
    maxFaultDelayMs: 2000
  databasePool:
    write:
      size: 2
      maxOverflow: 1
    read:
      size: 3
      maxOverflow: 1
    timeoutSeconds: 10
  cacheConsistency:
    # 실제 RDS ReplicaLag의 p99/p999를 관측한 뒤 조정한다.
    replicaWindowSeconds: 60
  topologySpread:
    enabled: false
    whenUnsatisfiable: ScheduleAnyway
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

# HPA가 CPU 메트릭을 사용하기 위함 -> 컨테이너에도 적용
  resources:
    requests:        # Kubernetes가 Pod를 노드에 배치할 때 보장하는 최소 자원
      cpu: 100m
      memory: 128Mi
    limits:          # Pod가 사용할 수 있는 최대 자원 (초과 시 제한)
      cpu: 500m
      memory: 512Mi # 초과 시 OOMKilled (강제 종료)

# ── PostgreSQL 설정 ────────────────────────────────────────
postgres:
  enabled: true # 개발 환경
  version: '15'
  user: postgres
  database: prod-db
  # 민감정보는 values-secret.yaml로 분리하고 Git 추적에서 제외한다.
  password: ""
  databaseUrl: ""
  storage: 1Gi
  storageClass: standard

# ── Ingress 설정 ───────────────────────────────────────────
ingress:
  enabled: false # 기본 배포는 별도 url-shortener/k8s/traefik/ingress.yaml 사용
  className: traefik # 차트의 Ingress를 명시적으로 켤 때 사용할 컨트롤러
  host: url-shortener.local
  pathType: Prefix
  annotations: {} # 필요한 주석만 명시하며 API 경로는 재작성하지 않음
  tls:
    enabled: false
    secretName: ""

# ── HPA 설정 ───────────────────────────────────────────
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 2
  targetCPUUtilizationPercentage: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

pdb:
  enabled: false
  minAvailable: 1

# ── RDS 설정 (운영 전용) ────────────────────────────────────────
rds:
  writeUrl: ""    # 운영: values.prod-secret.yaml로 주입
  readUrl: ""     # 운영: values.prod-secret.yaml로 주입

# ── Redis 설정 ───────────────────────────────────────────
redis:
  enabled: false
  url: ""

# --- ServiceMonitor 설정 ────────────────────────────────────────
serviceMonitor:
  enabled: false
  interval: 30s

# ── NetworkPolicy 설정 ─────────────────────────────────────────
# 외부 시스템의 주소는 환경별 values에서 CIDR로 제공한다.
networkPolicy:
  enabled: false
  traefik:
    namespace: traefik
    podSelector:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-traefik
  prometheus:
    namespace: monitoring
    podSelector:
      app.kubernetes.io/name: prometheus
  dns:
    namespace: kube-system
    podSelector:
      k8s-app: kube-dns
  redis:
    # Service selector와 동일해야 EKS VPC CNI가 ClusterIP 경로도 허용한다.
    podSelector:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis
      app.kubernetes.io/component: master
    port: 6379
  externalEgress:
    # 클러스터 밖 RDS의 VPC 또는 서브넷 CIDR만 환경별 values에서 허용한다.
    cidrs: []
    postgresPort: 5432
