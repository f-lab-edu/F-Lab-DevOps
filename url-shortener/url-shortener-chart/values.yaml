# ── API 설정 ──────────────────────────────────────────────
api:
  replicas: 2
  port: 8000
  image:
    repository: url-shortener-api
    tag: v1
    pullPolicy: Never
  env:
    appEnv: production
    debug: 'false'
    enableFaultInjection: false
    maxFaultDelayMs: 2000
  topologySpread:
    enabled: false
    whenUnsatisfiable: ScheduleAnyway
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

# HPA가 CPU 메트릭을 사용하기 위함 -> 컨테이너에도 적용
  resources:
    requests:        # Kubernetes가 Pod를 노드에 배치할 때 보장하는 최소 자원
      cpu: 100m
      memory: 128Mi
    limits:          # Pod가 사용할 수 있는 최대 자원 (초과 시 제한)
      cpu: 500m
      memory: 512Mi # 초과 시 OOMKilled (강제 종료)

# ── PostgreSQL 설정 ────────────────────────────────────────
postgres:
  enabled: true # 개발 환경
  version: '15'
  user: postgres
  database: prod-db
  # 민감정보는 values-secret.yaml로 분리해서 사용하세요 (Git ignore 권장)
  password: ""
  databaseUrl: ""
  storage: 1Gi
  storageClass: standard

# ── Ingress 설정 ───────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: url-shortener.local
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ── HPA 설정 ───────────────────────────────────────────
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 2
  targetCPUUtilizationPercentage: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

pdb:
  enabled: false
  minAvailable: 1

# ── RDS 설정 (prod 전용) ────────────────────────────────────────
rds:
  writeUrl: ""    # prod: values.prod-secret.yaml로 주입
  readUrl: ""     # prod: values.prod-secret.yaml로 주입

# ── Redis 설정 ───────────────────────────────────────────
redis:
  enabled: false
  url: ""

# --- ServiceMonitor 설정 ────────────────────────────────────────
serviceMonitor:
  enabled: false
  interval: 30s
